services:
  lightspeed-postgres:
    image: postgres:16-alpine
    container_name: lightspeed-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightspeed_db}
      POSTGRES_USER: ${POSTGRES_USER:-lightspeed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightspeed_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightspeed_user} -d ${POSTGRES_DB:-lightspeed_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
